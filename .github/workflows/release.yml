name: Release packages
# Tag a commit `vX.Y.Z` to build unsigned Windows, macOS and Linux packages
# and attach them to a GitHub Release. The packages are open-source builds
# without a code-signing certificate; the release notes explain the first-run
# prompts each platform shows for unsigned software.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux --x64
          - os: windows-latest
            target: --win --x64
          - os: macos-15
            target: --mac --arm64
            unpacked: apps/desktop/release/mac-arm64/newslettercreator.app/Contents/MacOS/newslettercreator
          - os: macos-15
            target: --mac --x64
            unpacked: apps/desktop/release/mac/newslettercreator.app/Contents/MacOS/newslettercreator
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:typecheck
      - run: npx eslint apps/desktop/src packages/core/src
      - run: npm run test --workspace @newsletter/desktop
      - run: npm run desktop:build
      - if: runner.os == 'Linux'
        run: xvfb-run -a node tests/desktop-smoke.mjs
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" node tests/desktop-studio.mjs
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" node tests/desktop-contrast.mjs
      - run: npm exec --workspace @newsletter/desktop -- electron-builder --publish never ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a node tests/desktop-package-smoke.mjs
      - if: runner.os != 'Linux'
        run: node tests/desktop-package-smoke.mjs ${{ matrix.unpacked }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}-${{ strategy.job-index }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create the GitHub Release with every package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la packages
          gh release create "$GITHUB_REF_NAME" packages/* \
            --title "NewsletterCreator $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES_TEMPLATE.md \
            --verify-tag
