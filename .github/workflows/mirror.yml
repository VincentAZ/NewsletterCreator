name: Mirror to AILearningCenter

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push mirror to target repo
        env:
          SOURCE_REPOSITORY_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          MIRROR_REPOSITORY_URL: https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/AILearningCenter/NewsletterCreator.git
        run: bash scripts/mirror-repository.sh
